name: Build ESP32 Firmware

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install PlatformIO
        run: pip install platformio
        
      - name: Build firmware and filesystem
        run: |
          pio run
          pio run --target buildfs
          
      - name: Prepare Individual Files
        run: |
          mkdir release_files
          cp .pio/build/esp32s3_n16r8/bootloader.bin release_files/
          cp .pio/build/esp32s3_n16r8/partitions.bin release_files/
          cp .pio/build/esp32s3_n16r8/firmware.bin release_files/
          cp .pio/build/esp32s3_n16r8/littlefs.bin release_files/
            
      - name: Upload Separate Binaries
        uses: actions/upload-artifact@v4
        with:
          name: separate-binaries
          path: release_files/
